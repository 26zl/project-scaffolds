name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # test.sh hard-requires shellcheck; do not rely on the runner image carrying it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - if: runner.os == 'macOS'
        run: brew install shellcheck shfmt
      # macOS ships bash 3.2 and Homebrew puts 5.x first on PATH, so shadow it to test the bash the README promises.
      - if: runner.os == 'macOS'
        run: mkdir -p "$RUNNER_TEMP/bash32" && ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash" && echo "$RUNNER_TEMP/bash32" >>"$GITHUB_PATH"
      - run: ./test.sh
